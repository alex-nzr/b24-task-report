security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    providers:
        operators:
            memory:
                users:
                    '%env(REPORT_LOGIN)%':
                        password: '%env(REPORT_PASSWORD_HASH)%'
                        roles: [ROLE_REPORT]
    firewalls:
        main:
            lazy: true
            provider: operators
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
            logout:
                path: logout
                enable_csrf: true
    access_control:
        - { path: '^/login$', roles: PUBLIC_ACCESS }
        - { path: '^/', roles: ROLE_REPORT }
